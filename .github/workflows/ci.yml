name: DetectionForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api]'
      - run: python -m unittest discover -s tests -v
      - run: detectionforge validate
      - run: detectionforge evaluate --output reports/ci-evaluation.json
      - run: detectionforge ml-rank --output reports/ci-ml-ranking.json
      - run: python scripts/export_kql.py
      - run: python -m compileall detectionforge
