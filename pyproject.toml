[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detectionforge"
version = "0.1.0"
description = "Detection-as-code lab for Sigma-style rules, KQL compilation, replay evaluation, regression gates, and ATT&CK coverage."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
detectionforge = "detectionforge.cli:main"

[tool.setuptools.packages.find]
include = ["detectionforge*"]
