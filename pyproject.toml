[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detectionforge"
version = "0.2.0"
description = "Detection-as-code lab with supervised alert prioritization, active learning, replay evaluation, regression gates, KQL compilation, and ATT&CK coverage."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "scikit-learn>=1.7,<1.8"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
detectionforge = "detectionforge.cli:main"

[tool.setuptools.packages.find]
include = ["detectionforge*"]
